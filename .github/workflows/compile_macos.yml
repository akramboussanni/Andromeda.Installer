on:
  workflow_call:
    inputs:
      VERSION:
        required: true
        type: string

jobs:
  compile_macos:
    name: Build MacOS App Bundle
    runs-on: macos-latest
    env:
      PROJECT_PATH: ./Andromeda.Installer.csproj
    steps:
      - uses: actions/checkout@v5
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Restore Dependencies
        run: dotnet restore "$PROJECT_PATH"

      - name: Build Release for osx-x64
        run: dotnet publish "$PROJECT_PATH" -r osx-x64 -p:BuildNumber="${{ github.run_number }}" -p:Version="${{ inputs.VERSION }}"
        
      - name: Build Release for osx-arm64
        run: dotnet publish "$PROJECT_PATH" -r osx-arm64 -p:BuildNumber="${{ github.run_number }}" -p:Version="${{ inputs.VERSION }}"

      - name: Create Universal Binary using lipo
        run: |
          mkdir -p "Output/osx-universal/Andromeda Installer.app/Contents/MacOS"
          lipo -create \
            Output/osx-x64/MelonLoader.Installer.MacOS \
            Output/osx-arm64/MelonLoader.Installer.MacOS \
            -output "Output/osx-universal/Andromeda Installer.app/Contents/MacOS/MelonLoader.Installer.MacOS"
          for library in libAvaloniaNative.dylib libHarfBuzzSharp.dylib libSkiaSharp.dylib; do
            lipo -create "Output/osx-x64/$library" "Output/osx-arm64/$library" \
              -output "Output/osx-universal/Andromeda Installer.app/Contents/MacOS/$library"
          done
        
      - name: Copy App Bundle Resources
        run: |
          mkdir -p "Output/osx-universal/Andromeda Installer.app/Contents/Resources"
          cp Info.plist "Output/osx-universal/Andromeda Installer.app/Contents/"
          cp Resources/icon.icns "Output/osx-universal/Andromeda Installer.app/Contents/Resources/"

      - name: Sign and package app bundle
        run: |
          codesign --force --deep --sign - "Output/osx-universal/Andromeda Installer.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "Output/osx-universal/Andromeda Installer.app" \
            "Output/Andromeda.Installer.MacOS.zip"

      - name: Upload Release
        uses: actions/upload-artifact@v5
        with:
          name: MelonLoader.Installer.MacOS
          path: Output/Andromeda.Installer.MacOS.zip
